name = "stogas-docs"
compatibility_date = "2025-11-16"

minify = true
keep_names = false
upload_source_maps = false

[dev]
port = 5174
inspector_port = 9230
local_protocol = "http"

[observability]
enabled = true

[assets]
directory = "out"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[env.local]
name = "stogas-docs-local"

[env.staging]
name = "stogas-docs-staging"

[[env.staging.routes]]
pattern = "staging.stogas.ai/docs*"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/_next/*"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/__nextjs_font/*"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/api/search"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/openapi.json"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/apis.json"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/.well-known/api-catalog"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/robots.txt"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/sitemap.xml"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/og/docs/*"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/llms.txt"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/llms-full.txt"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/llms.mdx/docs/*"
zone_name = "stogas.ai"

[[env.staging.routes]]
pattern = "staging.stogas.ai/llms.mdx/reference/*"
zone_name = "stogas.ai"

[env.staging.observability]
enabled = true

